<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社労士日光街道すごろく</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --vermillion:#c0432b; --indigo-900:#28457a; --gold:#c79a3e; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#fdf6e8; font-family:'Zen Kaku Gothic New', sans-serif; color:var(--indigo-900);
    padding:24px; text-align:center;
  }
  .card{
    background:#fffaf0; border-radius:20px; padding:40px 28px; max-width:420px; width:100%;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.25); border:1px solid #e8dcc0;
  }
  .dice{ font-size:64px; margin-bottom:8px; }
  h1{ font-family:'Shippori Mincho', serif; font-size:1.4rem; margin:0 0 16px; }
  p{ line-height:1.8; font-size:0.95rem; margin:0 0 10px; }
  .date{ display:inline-block; margin-top:10px; background:var(--vermillion); color:#fff8ee; padding:8px 20px; border-radius:999px; font-weight:800; font-size:0.95rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="dice">🎲</div>
    <h1>ただいまメンテナンス中です</h1>
    <p>ご不便をおかけして申し訳ございません。<br>只今、システムのメンテナンスを行っております。</p>
    <div class="date">9/16（水）復旧予定</div>
  </div>
</body>
</html>
